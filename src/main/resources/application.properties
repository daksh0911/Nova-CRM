# ===================================================================
# Vertex CRM Enterprise Configuration
# ===================================================================
spring.application.name=vertex-crm-backend
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.vertexcrm=DEBUG

# Static Resource Handling (serves HTML/CSS/JS frontend on http://localhost:8080)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ===================================================================
# H2 Database Configuration (Live File-Based Database)
# Data is saved in ./data/vertexcrm folder - persists across restarts
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/vertexcrm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console - View your database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
